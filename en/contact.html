<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Bazan Cacao</title>
  <meta name="description" content="Get in touch with Bazan Cacao: email, phone/Zalo or send us a message.">
  <link rel="alternate" hreflang="vi" href="https://bazancacao.vn/lien-he">
  <link rel="alternate" hreflang="en" href="https://bazancacao.vn/en/contact">
  <link rel="alternate" hreflang="x-default" href="https://bazancacao.vn/lien-he">
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Calistoga&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <header class="page-head">
      <div class="wrap">
        <span class="eyebrow">Contact</span>
        <h1>Write to Bazan Cacao</h1>
      </div>
    </header>

    <section class="section">
      <div class="wrap split" style="align-items:start">
        <div>
          <dl class="spec" style="border-color:var(--line)">
            <div style="border-color:var(--line)"><dt>Email</dt><dd data-contact="email">—</dd></div>
            <div style="border-color:var(--line)"><dt>Phone/Zalo</dt><dd data-contact="phone">—</dd></div>
            <div style="border-color:var(--line)"><dt>Office</dt><dd data-contact="address">—</dd></div>
          </dl>
          <p class="muted">Need a wholesale quote for your business? <a href="business#bao-gia">Send a B2B request</a>.</p>
        </div>
        <div>
          <form class="form" data-form="contact" data-subject="Liên hệ (tiếng Anh) — Website Bazan Cacao">
            <div class="field"><label for="c-name">Full name *</label><input id="c-name" name="Họ tên" required autocomplete="name"></div>
            <div class="field"><label for="c-contact">Phone or email *</label><input id="c-contact" name="Liên hệ" required></div>
            <div class="field"><label for="c-msg">Message *</label><textarea id="c-msg" name="Lời nhắn" required></textarea></div>
            <button class="btn" type="submit">Send message</button>
          </form>
          <p class="form-msg" hidden tabindex="-1">Thank you! We will get back to you soon.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/data-en.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
