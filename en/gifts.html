<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gifts — Bazan Cacao</title>
  <meta name="description" content="Cacao gift boxes Ghiền Cacao, Hảo Vặt, Nhâm Nhi, Trọn Vẹn Cacao and seasonal editions.">
  <link rel="alternate" hreflang="vi" href="https://bazancacao.vn/qua-tang">
  <link rel="alternate" hreflang="en" href="https://bazancacao.vn/en/gifts">
  <link rel="alternate" hreflang="x-default" href="https://bazancacao.vn/qua-tang">
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Calistoga&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero hero--page">
      <!-- Temporary photo: Jornada Produtora / Unsplash — https://unsplash.com/photos/daInAb9XYr8 -->
      <div class="ph ph--photo"><img src="../assets/img/hop-qua-doanh-nghiep.jpg" width="1200" height="800" alt="Kraft gift box tied with a red ribbon"></div>
      <div class="wrap hero__inner">
        <span class="eyebrow">Gifts</span>
        <h1>Share an original taste</h1>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="cards cards--4" data-products="combos"></div>
      </div>
    </section>

    <section class="section section--paper">
      <div class="wrap">
        <span class="eyebrow">Seasonal editions</span>
        <h2 style="margin-bottom:40px">Celebrate every season with cacao.</h2>
        <div class="season">
          <div class="season__item">
            <div class="ph ph--teal" data-label="Christmas gift box"></div>
            <div class="season__cap"><h3>Christmas</h3><p>Coming soon</p></div>
          </div>
          <div class="season__item">
            <div class="ph" data-label="Lunar New Year gift box"></div>
            <div class="season__cap"><h3>Lunar New Year (Tết)</h3><p>Coming soon</p></div>
          </div>
          <div class="season__item">
            <div class="ph ph--cream" data-label="Mid-Autumn gift box"></div>
            <div class="season__cap"><h3>Mid-Autumn Festival</h3><p>Coming soon</p></div>
          </div>
        </div>
        <a class="link" data-link="facebook" target="_blank" rel="noopener" style="margin-top:32px">Follow the Bazan Cacao fanpage to hear when they launch</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/data-en.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
