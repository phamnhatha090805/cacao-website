<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liên hệ — Bazan Cacao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <header class="page-head">
      <div class="wrap">
        <span class="eyebrow">Liên hệ</span>
        <h1>Gửi lời đến Bazan Cacao</h1>
      </div>
    </header>

    <section class="section">
      <div class="wrap split" style="align-items:start">
        <div>
          <dl class="spec" style="border-color:var(--line)">
            <div style="border-color:var(--line)"><dt>Email</dt><dd data-contact="email">—</dd></div>
            <div style="border-color:var(--line)"><dt>SĐT/Zalo</dt><dd data-contact="phone">—</dd></div>
            <div style="border-color:var(--line)"><dt>Kho/Văn phòng</dt><dd data-contact="address">—</dd></div>
          </dl>
          <p class="muted">Doanh nghiệp cần báo giá sỉ hoặc quà tặng? <a href="doanh-nghiep.html#bao-gia">Gửi yêu cầu B2B</a>.</p>
        </div>
        <div>
          <form class="form" data-form="contact" data-subject="Liên hệ — Website Bazan Cacao">
            <div class="field"><label for="c-name">Họ tên *</label><input id="c-name" name="Họ tên" required autocomplete="name"></div>
            <div class="field"><label for="c-contact">SĐT hoặc email *</label><input id="c-contact" name="Liên hệ" required></div>
            <div class="field"><label for="c-msg">Lời nhắn *</label><textarea id="c-msg" name="Lời nhắn" required></textarea></div>
            <button class="btn" type="submit">Gửi lời nhắn</button>
          </form>
          <p class="form-msg" hidden tabindex="-1">Cảm ơn bạn! Chúng tôi sẽ phản hồi sớm.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
