<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quà tặng — Bazan Cacao</title>
  <meta name="description" content="Hộp quà cacao Ghiền Cacao, Hảo Vặt, Nhâm Nhi, Trọn Vẹn Cacao và phiên bản mùa lễ.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Calistoga&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero hero--page">
      <!-- Ảnh tạm: Jornada Produtora / Unsplash — https://unsplash.com/photos/daInAb9XYr8. CẬP NHẬT: ảnh hộp quà của khách. -->
      <div class="ph ph--photo"><img src="assets/img/hop-qua-doanh-nghiep.jpg" width="1200" height="800" alt="Hộp quà giấy kraft buộc ruy băng đỏ"></div>
      <div class="wrap hero__inner">
        <span class="eyebrow">Quà tặng</span>
        <h1>Trao nhau một vị nguyên bản</h1>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="cards cards--4" data-products="combos"></div>
      </div>
    </section>

    <section class="section section--paper">
      <div class="wrap">
        <span class="eyebrow">Phiên bản mùa lễ</span>
        <h2 style="margin-bottom:40px">Đón từng mùa lễ cùng cacao.</h2>
        <div class="season">
          <div class="season__item">
            <div class="ph ph--teal" data-label="Hộp quà Giáng sinh"></div>
            <div class="season__cap"><h3>Giáng sinh</h3><p>Sắp ra mắt</p></div>
          </div>
          <div class="season__item">
            <div class="ph" data-label="Hộp quà Tết"></div>
            <div class="season__cap"><h3>Tết</h3><p>Sắp ra mắt</p></div>
          </div>
          <div class="season__item">
            <div class="ph ph--cream" data-label="Hộp quà Trung thu"></div>
            <div class="season__cap"><h3>Trung thu</h3><p>Sắp ra mắt</p></div>
          </div>
        </div>
        <a class="link" data-link="facebook" target="_blank" rel="noopener" style="margin-top:32px">Theo dõi fanpage Bazan Cacao để nhận tin khi bộ quà ra mắt</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
